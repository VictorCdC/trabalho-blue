# Ambiente de desenvolvimento. Requer um .env na raiz: cp .env.example .env
# Nenhum segredo é definido aqui — só lido do .env.
#
# O banco não está aqui: é o PostgreSQL da máquina, o mesmo que a venv, o
# alembic e o cliente de banco usam. Ter um Postgres em contêiner ao lado
# desse fazia dois "bancos de dev" divergirem em silêncio — migration aplicada
# num, seed rodado no outro. Daí as duas URLs no .env: o host chega ao Postgres
# por `localhost`, o contêiner por `host.docker.internal`.

services:
  frontend:
    build:
      context: ./frontend
      target: dev
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      # O bind mount acima não propaga eventos de arquivo do host Windows para
      # dentro do container: o arquivo muda, `next dev` não fica sabendo e
      # segue servindo o bundle antigo até alguém reiniciar o serviço. Sem
      # isto se depura código que não é o que está no disco. Em host Linux o
      # watcher nativo funciona e a sondagem é só CPU gasta — lá, `false`.
      - WATCHPACK_POLLING=${WATCHPACK_POLLING:-true}
    depends_on:
      backend:
        condition: service_started

  # roda as migrations e sai. O backend só sobe depois que este termina bem —
  # migration em startup de aplicação vira corrida quando há mais de um processo.
  migracoes:
    build:
      context: ./backend
      target: dev
    command: ["alembic", "upgrade", "head"]
    volumes:
      - ./backend:/app
    # `host-gateway` é o que faz o nome existir também fora do Docker Desktop
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - DATABASE_URL=${DATABASE_URL_CONTAINER:?defina no .env}
      - SECRET_KEY=${SECRET_KEY:?defina no .env}

  backend:
    build:
      context: ./backend
      target: dev
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - DATABASE_URL=${DATABASE_URL_CONTAINER:?defina no .env}
      - AMBIENTE=${AMBIENTE:-desenvolvimento}
      - SECRET_KEY=${SECRET_KEY:?defina no .env}
      - SESSAO_HORAS=${SESSAO_HORAS:-8}
      - COOKIE_SECURE=${COOKIE_SECURE:-false}
      - LOGIN_MAX_TENTATIVAS=${LOGIN_MAX_TENTATIVAS:-5}
      - LOGIN_BLOQUEIO_MINUTOS=${LOGIN_BLOQUEIO_MINUTOS:-15}
      - K_MINIMO_AGREGACAO=${K_MINIMO_AGREGACAO:-5}
      - ORIGENS_PERMITIDAS=${ORIGENS_PERMITIDAS:-http://localhost:3000}
    depends_on:
      migracoes:
        condition: service_completed_successfully
